name: Build Android app

on:
  push:
    branches: [main, "claude/**"]
    paths: ["app/**", "packages/**", "package*.json", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      trusted_keys_json:
        description: "Public key file exported from the License Manager (paste its content). Leave empty to use app/trusted-keys.json"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Android SDK platform and build tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci

      # Public verification keys only. Set the repository variable LICENSE_TRUSTED_KEYS to the JSON saved by the
      # License Generator ("Save public key file"), or commit it as app/trusted-keys.json.
      - name: Use trusted public keys from workflow input
        if: ${{ github.event.inputs.trusted_keys_json != '' }}
        run: printf '%s' "$KEYS" > app/trusted-keys.json
        env: { KEYS: "${{ github.event.inputs.trusted_keys_json }}" }

      - name: Use trusted public keys from repository variable
        if: ${{ vars.LICENSE_TRUSTED_KEYS != '' }}
        run: printf '%s' "$KEYS" > app/trusted-keys.json
        env: { KEYS: "${{ vars.LICENSE_TRUSTED_KEYS }}" }

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w app
      - run: npx cap sync android
        working-directory: app
      - run: node scripts/check-no-private-key.mjs

      - name: Decode release keystore (optional)
        if: ${{ env.KS != '' }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks" && echo "SMLOYALTY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }

      - name: Build APK and AAB
        working-directory: app/android
        env:
          SMLOYALTY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SMLOYALTY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SMLOYALTY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Verify the built packages contain no signing keys
        run: |
          for f in app/android/app/build/outputs/apk/*/*.apk app/android/app/build/outputs/bundle/release/*.aab; do node scripts/check-no-private-key.mjs "$f"; done

      - uses: actions/upload-artifact@v4
        with:
          name: smartmanager-loyalty-android
          path: |
            app/android/app/build/outputs/apk/debug/*.apk
            app/android/app/build/outputs/apk/release/*.apk
            app/android/app/build/outputs/bundle/release/*.aab

      - name: Assemble the package (app + license manager + docs)
        run: |
          P=SmartManager-Loyalty-Package
          mkdir -p $P/License-Manager $P/docs
          cp app/android/app/build/outputs/apk/debug/app-debug.apk $P/SmartManagerLoyalty.apk
          cp license-manager/index.html $P/License-Manager/index.html
          cp package/START_HERE.txt $P/START_HERE.txt
          cp docs/LICENSE_GENERATOR_GUIDE.md docs/LICENSING.md docs/BACKUP_RESTORE.md docs/BUILD_ANDROID.md docs/BUILD_IOS.md $P/docs/
          KEYS=$(node -p "require('./app/trusted-keys.json').map(k=>k.keyId).join(', ') || 'NONE - the app cannot be activated'")
          { echo "Built from commit $GITHUB_SHA (run $GITHUB_RUN_NUMBER)"; echo "Trusted license key ids: $KEYS"; echo "APK sha256: $(sha256sum $P/SmartManagerLoyalty.apk | cut -d' ' -f1)"; } > $P/BUILD_INFO.txt
          node scripts/check-no-private-key.mjs $P/SmartManagerLoyalty.apk
          zip -r $P.zip $P
      - uses: actions/upload-artifact@v4
        with: { name: SmartManager-Loyalty-Package, path: SmartManager-Loyalty-Package.zip }
      - name: Publish as a GitHub Release (easy download)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" SmartManager-Loyalty-Package.zip --target "$GITHUB_SHA" --prerelease \
            --title "SmartManager Loyalty package (build ${GITHUB_RUN_NUMBER})" \
            --notes "App APK + License Manager + docs. Read START_HERE.txt inside the zip. $(cat SmartManager-Loyalty-Package/BUILD_INFO.txt | tr '\n' ' ')"
