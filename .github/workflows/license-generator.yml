name: Build License Generator

on:
  push:
    branches: [main, "claude/**"]
    paths: ["license-generator/**", "packages/**", "package*.json", ".github/workflows/license-generator.yml"]
  workflow_dispatch:

jobs:
  generator:
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest, macos-latest, ubuntu-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test -w license-generator
      - run: npm test -w @smloyalty/license-core
      - run: npm run build -w license-generator
      - run: npx electron-builder --publish never
        working-directory: license-generator
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with:
          name: license-generator-${{ matrix.os }}
          path: |
            license-generator/release/*.exe
            license-generator/release/*.dmg
            license-generator/release/*.AppImage
